<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- This app's one origin holds every deck and every class list of children's
       names, so the policy's job is that nothing which is not ours can run in
       it. `script-src 'self'` is honest here only because there are no inline
       handlers, no CDN, self-hosted chrome fonts and every library vendored.
       Must come before anything it governs: a meta policy applies only to what
       is fetched after it is parsed.

       What each relaxation buys, so that none of them are cargo cult:
         blob:  the export workers, which are built from a Blob, and the local
                document preview's object URLs
         data:  the favicon below, and teacher-uploaded images, which are
                stored as data URLs rather than as files
         https: the widgets that exist to show the web — embed, video,
                document — plus community template sources and the Unsplash
                backgrounds. Never in script-src, never in default-src.

       Deliberately absent: `data:` in frame-src. That is the shape of the
       attack this release closed — a shared template naming a data:text/html
       document and getting script onto the classroom board.

       THIS POLICY SHIPS INSIDE THE DESKTOP APP TOO. copy-dist.sh copies
       index.html verbatim into dist/ and tauri.conf.json points frontendDist at
       it, so in the bundle this meta is enforced *alongside*
       app.security.csp — and a browser applies every policy it is given, so the
       intersection wins. Anything Tauri needs and this omits is therefore
       blocked, however permissive the Tauri config is. That is why `ipc:` and
       `http://ipc.localhost` appear below in a policy that also runs in a plain
       browser: they are meaningless there and load-bearing in the bundle, where
       they are how the webview reaches Rust — which is the Documents file
       backend. Keep the two in step directive by directive
       (storage-abstraction-plan.md §7). -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' blob:;
    worker-src 'self' blob:;
    child-src 'self' blob:;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https: asset: asset://localhost http://asset.localhost;
    font-src 'self';
    media-src 'self' data: blob: https:;
    frame-src 'self' blob: https:;
    connect-src 'self' ipc: http://ipc.localhost https:;
    object-src 'none';
    base-uri 'none';
    form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sage Stage — your classroom screen, your data</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css?v=1" />
  <link rel="stylesheet" href="style.css?v=124" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
</head>
<body>
  <div id="stage"></div>

  <header id="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🌿</span>
      <span id="brandName">Sage Stage</span>
      <span class="tag">100% local</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="homeBtn" data-help="homeBtn" title="All decks &amp; class lists" aria-label="All decks and class lists"><span aria-hidden="true">🏠</span></button>
      <button class="icon-btn" id="dataBtn" data-help="dataBtn" title="Your data — backup, restore, and recently closed widgets" aria-label="Your data — backup, restore, and recently closed widgets"><span aria-hidden="true">💾</span></button>
      <button class="icon-btn" id="helpBtn" data-help="helpBtn" title="Help — what you're looking at, and where your data lives" aria-label="Help — what you're looking at, and where your data lives"><span aria-hidden="true">❓</span></button>
      <button class="icon-btn" id="fullscreenBtn" data-help="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen"><span aria-hidden="true">⛶</span></button>
    </div>
  </header>

  <nav id="toolbar" aria-label="Widgets"></nav>

  <nav id="screenNav" aria-label="Screens">
    <button id="prevScreen" data-help="prevScreen" title="Previous screen" aria-label="Previous screen"><span aria-hidden="true">‹</span></button>
    <button id="deckBtn" data-help="deckBtn" title="Screens"><span id="screenLabel">1 / 1</span></button>
    <button id="nextScreen" data-help="nextScreen" title="Next screen" aria-label="Next screen"><span aria-hidden="true">›</span></button>
    <button id="addScreen" data-help="addScreen" title="Add screen" aria-label="Add screen"><span aria-hidden="true">＋</span></button>
    <button id="delScreen" data-help="delScreen" title="Delete this screen" aria-label="Delete this screen"><span aria-hidden="true">🗑</span></button>
  </nav>

  <canvas id="drawLayer"></canvas>
  <div id="drawTools"></div>

  <!-- role="status" is an implicitly polite live region: a screen reader
       announces a toast when it appears without interrupting the teacher
       mid-sentence. Without it "Could not save — storage is full" was silent. -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="sanitize.js?v=3"></script>
  <script src="snapshots.js?v=2"></script>
  <script src="qr.js?v=6"></script>
  <script src="templates.js?v=5"></script>
  <script src="icons-scarlab.js?v=6"></script>
  <script src="icons.js?v=27"></script>
  <script src="export.js?v=5"></script>
  <script src="print.js?v=15"></script>
  <script src="pptx-import.js?v=4"></script>
  <script src="english-packs.js?v=4"></script>
  <script src="zip.js?v=2"></script>
  <script src="doctext.js?v=2"></script>
  <script src="english-word.js?v=42"></script>
  <script src="modelwrite.js?v=28"></script>
  <script src="english-text.js?v=17"></script>
  <script src="help/widgets-data.js?v=1"></script>
  <script src="storage.js?v=9"></script>
  <script src="app.js?v=109"></script>
</body>
</html>
