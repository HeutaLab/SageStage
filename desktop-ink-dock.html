<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sage Stage — ink controls</title>
<!-- The pill for the desktop ink overlay (docs/desktop-ink-design.md §2.2).
     Its own always-on-top window, so it stays clickable while the ink window
     underneath ignores the cursor. Static: no app.js, no state, five buttons.
     Styles inline (style-src allows it); the script is a file because the CSP
     does not allow inline script. -->
<link rel="stylesheet" href="vendor/fonts/fonts.css?v=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .pill {
    display: flex; align-items: center; gap: 2px; padding: 6px 8px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid rgba(15, 23, 42, 0.12);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18), 0 1px 3px rgba(15, 23, 42, 0.12);
    cursor: grab;
  }
  .pill:active { cursor: grabbing; }
  .grip { width: 10px; height: 26px; margin: 0 2px 0 0; border-radius: 4px;
    background: repeating-linear-gradient(90deg, rgba(15,23,42,.28) 0 2px, transparent 2px 4px); }
  button {
    appearance: none; border: 0; background: transparent; color: #0f172a;
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: 11px; font: 600 13px/1 'Quicksand', system-ui, sans-serif; cursor: pointer;
  }
  button svg { width: 22px; height: 22px; display: block; }
  button:hover { background: rgba(15, 118, 110, 0.1); }
  button.active { background: rgba(15, 118, 110, 0.14); color: #0f766e; box-shadow: inset 0 0 0 1.5px #0f766e; }
  button.exit:hover { background: rgba(220, 38, 38, 0.1); color: #b91c1c; }
  .sep { width: 1px; height: 24px; background: rgba(15, 23, 42, 0.12); margin: 0 4px; }
  .label { display: none; }
  @media (min-width: 320px) { button.mode .label { display: inline; } }
</style>
</head>
<body>
  <div class="pill" data-tauri-drag-region>
    <span class="grip" data-tauri-drag-region aria-hidden="true"></span>
    <button class="mode active" id="pen" title="Pen — draw over the screen (Esc drops to pointer)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16.5c3.5-7 5.8-9.6 7-8.4 1.3 1.3-2.6 5.6-1.2 6.8 1.4 1.2 4-4.4 6.4-5.6 1.6-.8 2.9-.2 3.8 1.2"/></svg>
      <span class="label">Pen</span>
    </button>
    <button class="mode" id="pointer" title="Pointer — click through to what is underneath; the ink stays">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5l12 5.6-5.2 1.9 3 5.6-2.6 1.4-3-5.6-4.2 3.6V4.5z" fill="#c7d2fe"/></svg>
      <span class="label">Pointer</span>
    </button>
    <span class="sep"></span>
    <button id="undo" title="Undo the last stroke">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5L4.5 9 8 12.5"/><path d="M4.5 9h9a5 5 0 0 1 0 10H9"/></svg>
    </button>
    <button id="clear" title="Clear all the ink (undo brings it back)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l.8 12.1A1.6 1.6 0 0 0 9.4 20.6h5.2a1.6 1.6 0 0 0 1.6-1.5L17 7" fill="#fecaca"/><path d="M5 7h14"/><path d="M9.5 7V5.7A1.7 1.7 0 0 1 11.2 4h1.6a1.7 1.7 0 0 1 1.7 1.7V7"/><path d="M10.2 10.8v6M13.8 10.8v6"/></svg>
    </button>
    <span class="sep"></span>
    <button class="exit" id="exit" title="Close the overlay — the ink goes with it">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
  </div>
  <script src="desktop-ink-dock.js?v=1"></script>
</body>
</html>
