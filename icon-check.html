<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon contact sheet (assessment scratch — not shipped)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f5; margin: 0; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
  .card { background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 1px 4px rgba(15,30,45,.08); }
  .name { font-size: 12.5px; font-weight: 700; color: #22303c; display: flex; gap: 6px; align-items: center; }
  .src { font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 99px; }
  .src.v { background: #fde68a; color: #7c2d12; }
  .src.h { background: #ccfbf1; color: #0f766e; }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .chip { display: grid; place-items: center; background: #eef2f1; border-radius: 8px; color: #22303c; }
  .s21 { width: 34px; height: 34px; } .s21 svg { width: 21px; height: 21px; }
  .s15 { width: 24px; height: 24px; } .s15 svg { width: 15px; height: 15px; }
  .s64 svg { width: 64px; height: 64px; }
  .s64 { color: #22303c; }
  .dead { margin-top: 8px; border-top: 1px dashed #d5dedd; padding-top: 6px; }
  .dead .lbl { font-size: 9.5px; font-weight: 800; color: #92400e; }
  svg { display: block; }
</style>
</head>
<body>
<h1>Runtime glyphs (V = vendored Scarlab wins · H = hand-drawn) — 64px inspect · 21px dock · 15px title-bar</h1>
<div class="grid" id="grid"></div>
<script src="icons-scarlab.js?v=5"></script>
<script src="icons.js?v=24"></script>
<script>
  // reach the hand-drawn originals even where vendored shadows them: rebuild
  // the hand-only lookup by asking icon() with the vendored set masked
  const vend = window.SageVendorIcons;
  const names = new Set(Object.keys(vend));
  // hand-drawn names: temporarily mask vendored and probe icon() for known list
  window.SageVendorIcons = null;
  const HAND = {};
  const probe = document.createElement('div');
  // no registry export, so harvest by regex over the fetched source
  fetch('icons.js?v=24').then(r => r.text()).then(src => {
    const handNames = new Set();
    for (const m of src.matchAll(/^\s{4}([a-z0-9]+):/gm)) { handNames.add(m[1]); names.add(m[1]); }
    for (const n of names) HAND[n] = window.SageIcons.icon(n);
    window.SageVendorIcons = vend;
    const grid = document.getElementById('grid');
    const sorted = [...names].sort();
    for (const n of sorted) {
      const runtime = window.SageIcons.icon(n);
      const isVend = !!(vend && vend[n]);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        `<div class="name">${n} <span class="src ${isVend ? 'v' : 'h'}">${isVend ? 'V' : 'H'}</span></div>` +
        `<div class="row"><span class="s64">${runtime}</span>` +
        `<span class="chip s21">${runtime}</span><span class="chip s15">${runtime}</span></div>` +
        (isVend && handNames.has(n)
          ? `<div class="dead"><span class="lbl">unused hand-drawn</span><div class="row"><span class="s64">${HAND[n]}</span><span class="chip s21">${HAND[n]}</span></div></div>`
          : '');
      grid.append(card);
    }
    document.title = 'sheet-ready-' + sorted.length;
  });
</script>
</body>
</html>
