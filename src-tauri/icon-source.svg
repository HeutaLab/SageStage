<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sage Stage's app icon. The leaf is the app's own mark (index.html's 🌿
       favicon and the .logo span), drawn as vector so it renders identically at
       16px in a dock and at 1024px in an installer, and so it carries the
       mint-to-teal palette the dashboard already uses rather than whatever the
       platform emoji font happens to look like. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#eaf7f4"/>
      <stop offset="0.45" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e56"/>
    </linearGradient>
    <!-- fades in rather than starting at an edge; a flat rect drew a hard
         horizontal seam across the middle of the icon at every size -->
    <linearGradient id="settle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0.20"/>
    </linearGradient>
  </defs>

  <!-- squircle with transparent corners, so macOS does not mask a square -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#ground)"/>

  <!-- a soft teal settle at the foot, so the sprig has something to stand on -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#settle)"/>

  <g transform="translate(512 548)">
    <!-- the stem -->
    <path d="M0 300 C -6 170 6 40 0 -250"
          fill="none" stroke="url(#leafDark)" stroke-width="26" stroke-linecap="round"/>

    <!-- leaves, alternating up the stem; each is one teardrop rotated into place -->
    <g fill="url(#leaf)">
      <g transform="translate(0 -232) rotate(-34)">
        <path d="M0 0 C 62 -74 176 -62 216 0 C 176 62 62 74 0 0 Z"/>
      </g>
      <g transform="translate(0 -232) rotate(214)">
        <path d="M0 0 C 54 -64 152 -54 188 0 C 152 54 54 64 0 0 Z"/>
      </g>

      <g transform="translate(2 -96) rotate(-20)">
        <path d="M0 0 C 68 -80 192 -68 236 0 C 192 68 68 80 0 0 Z"/>
      </g>
      <g transform="translate(-2 -96) rotate(200)">
        <path d="M0 0 C 68 -80 192 -68 236 0 C 192 68 68 80 0 0 Z"/>
      </g>

      <g transform="translate(4 48) rotate(-8)">
        <path d="M0 0 C 62 -74 176 -62 216 0 C 176 62 62 74 0 0 Z"/>
      </g>
      <g transform="translate(-4 48) rotate(188)">
        <path d="M0 0 C 62 -74 176 -62 216 0 C 176 62 62 74 0 0 Z"/>
      </g>
    </g>

    <!-- midribs, at the same weight as the stem's taper so nothing reads as outline -->
    <g fill="none" stroke="#ccfbf1" stroke-width="11" stroke-linecap="round" opacity="0.6">
      <path d="M0 -232 l 190 0" transform="rotate(-34 0 -232)"/>
      <path d="M0 -232 l 164 0" transform="rotate(214 0 -232)"/>
      <path d="M2 -96 l 206 0" transform="rotate(-20 2 -96)"/>
      <path d="M-2 -96 l 206 0" transform="rotate(200 -2 -96)"/>
      <path d="M4 48 l 188 0" transform="rotate(-8 4 48)"/>
      <path d="M-4 48 l 188 0" transform="rotate(188 -4 48)"/>
    </g>
  </g>
</svg>
