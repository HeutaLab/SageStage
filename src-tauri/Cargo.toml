[package]
name = "sage-stage"
version = "0.3.0"
description = "Sage Stage — a fully local classroom screen"
authors = ["Sage Stage"]
edition = "2021"
rust-version = "1.77"

# The binary is a thin shim over the library so the same `run()` can be driven
# from a desktop main() and, later, from a mobile entry point. This is the layout
# `tauri init` produces and the plan's §7 assumes (main.rs calls
# sage_stage_lib::run()).
[lib]
name = "sage_stage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Self-update (docs/updater-design.md). Rust does the whole job — check,
# download, verify, install — so no capability reaches JS and the webview's CSP
# is untouched. serde only so the one event the board hears can carry a struct.
# native-tls rather than the default rustls: a school that inspects TLS puts
# its own root certificate in the operating system's store, and only the OS
# stack (SecureTransport, SChannel) looks there. The proxy feature is for the
# same room.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
# generate_context!() embeds the plugins block of tauri.conf.json as a
# serde_json::Value and expects the crate to have it in scope.
serde_json = "1"
# The date in a pre-upgrade copy's name, in LOCAL time — toISOString-style
# UTC would label an evening copy in Bangkok with tomorrow and a morning one
# in Toronto with yesterday, and storage.js orders backups by that date.
# Already in the tree; default features off keeps it to the clock.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# A desktop app that takes a second longer to compile and starts faster is the
# right trade for something a teacher opens at 8:40am with a class coming in.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The desktop ink overlay (docs/desktop-ink-design.md §2.5) raises its window
# level and sets the collection behaviour that puts a window over another app's
# fullscreen Space. Tauri does not expose either; objc2-app-kit is already in
# the lock file as tao's dependency, so this adds no native stack.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSPanel"] }
# access(2), for asking whether the app bundle is the teacher's to replace
# before the updater would otherwise ask for an administrator password.
libc = "0.2"
