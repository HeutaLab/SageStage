[package]
name = "sage-stage"
version = "0.2.0"
description = "Sage Stage — a fully local classroom screen"
authors = ["Sage Stage"]
edition = "2021"
rust-version = "1.77"

# The binary is a thin shim over the library so the same `run()` can be driven
# from a desktop main() and, later, from a mobile entry point. This is the layout
# `tauri init` produces and the plan's §7 assumes (main.rs calls
# sage_stage_lib::run()).
[lib]
name = "sage_stage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# A desktop app that takes a second longer to compile and starts faster is the
# right trade for something a teacher opens at 8:40am with a class coming in.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The desktop ink overlay (docs/desktop-ink-design.md §2.5) raises its window
# level and sets the collection behaviour that puts a window over another app's
# fullscreen Space. Tauri does not expose either; objc2-app-kit is already in
# the lock file as tao's dependency, so this adds no native stack.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSPanel"] }
