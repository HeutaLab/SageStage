<meta charset="utf-8"><title>gt-chip harness</title>
<style>
body{margin:0;font:14px system-ui;background:#eef}
.widget{width:620px;height:420px;display:flex;flex-direction:column;gap:7px;padding:10px;background:#e2e8f0;box-sizing:border-box}
.grow{flex:1}
.gt-face{container-type:inline-size;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto}
.gt-chips{display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0}
.gt-chip{white-space:normal;text-align:left;line-height:1.3;padding:5px 12px;border-radius:999px;border:2px solid transparent;font:inherit;font-size:13px;font-weight:600;color:#1e293b;cursor:pointer;background:#fde68a}
.old .gt-chip{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 10px;line-height:normal;text-align:center}
.gt-text{flex:1;min-height:0;overflow:auto;padding:8px 10px;border-radius:11px;background:#fff;color:#0f172a;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.95;font-size:19px}
.gt-textbar{display:flex;justify-content:flex-end;flex-shrink:0}
</style>
<div class="widget" id="w1"><div class="gt-face grow" id="f1"></div></div>
<div class="widget old" id="w2"><div class="gt-face grow" id="f2"></div></div>
<script>
const LONG='Use a range of cohesive devices such as adverbials of time and place, pronouns and synonyms to link ideas across paragraphs so the reader is carried smoothly from one idea to the nex';
const TYP='Use fronted adverbials to open some sentences, with a comma';
function build(face,n,txt){
  const chips=document.createElement('div');chips.className='gt-chips';
  for(let i=0;i<n;i++){const b=document.createElement('button');b.className='gt-chip';b.textContent=txt;chips.appendChild(b);}
  const t=document.createElement('div');t.className='gt-text';t.textContent='The model text goes here. '.repeat(80);
  const bar=document.createElement('div');bar.className='gt-textbar';bar.innerHTML='<button>New text…</button>';
  face.replaceChildren(chips,t,bar);
  return {chips,t};
}
function measure(face,n,txt){const {chips,t}=build(face,n,txt);
  return {chipsH:Math.round(chips.getBoundingClientRect().height),textH:Math.round(t.getBoundingClientRect().height),faceScroll:face.scrollHeight-face.clientHeight};}
const out={};
out['NEW 20x200char']=measure(f1,20,LONG);
out['OLD 20x200char']=measure(f2,20,LONG);
out['NEW 20xtypical']=measure(f1,20,TYP);
out['OLD 20xtypical']=measure(f2,20,TYP);
out['NEW 8xtypical']=measure(f1,8,TYP);
out['OLD 8xtypical']=measure(f2,8,TYP);
out['NEW 1x200char']=measure(f1,1,LONG);
out['NEW 6x200char']=measure(f1,6,LONG);
document.title=JSON.stringify(out);
window.RESULT=out;
</script>
<div class="widget" id="w3" style="width:360px;height:300px"><div class="gt-face grow" id="f3"></div></div>
<script>
const s={};
[6,8,10,12,14,20].forEach(n=>{s['620w typical x'+n]=measure(f1,n,TYP);});
[4,6,8,12].forEach(n=>{s['360w typical x'+n]=measure(f3,n,TYP);});
s['360w 200char x2']=measure(f3,2,LONG);
window.SWEEP=s;
</script>
